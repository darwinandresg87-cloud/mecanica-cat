<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoCare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <h2>AutoCare</h2>
        <a href="index.html">Inicio</a>
    </nav>

    <main class="ancho">

        <!-- LOGIN -->
        <section id="login">
            <h1>Iniciar sesión</h1>

            <form id="formLogin">
                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>

                <div class="botones">
                    <button type="submit" class="boton">Entrar</button>
                    <a href="registro.html" class="boton-volver">Crear cuenta</a>
                </div>
            </form>

            <p class="texto-login">Acceso al sistema AutoCare</p>
        </section>

        <!-- PANEL -->
        <section id="panel">
            <h2 id="tituloPanel">Panel de control</h2>
            <p id="subtituloPanel">Gestión de solicitudes</p>
            <span id="rolBadge"></span>
            <div id="perfil"></div>

            <div class="filtros">
                <input type="text" id="buscar" placeholder="Buscar">
                <select id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Confirmada">Confirmada</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>

            <div class="tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Vehículo</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes"></tbody>
                </table>
            </div>

            <p id="contador">Total de solicitudes: 0</p>

            <!-- CRUD DE USUARIOS (solo Administrador) -->
            <div id="gestionUsuarios">
                <h2>Gestión de usuarios</h2>

                <form id="formUsuario">
                    <input type="hidden" id="usuarioIndice">

                    <div class="fila-usuario">
                        <div class="campo">
                            <label for="gUsuario">Usuario</label>
                            <input type="text" id="gUsuario" required>
                        </div>
                        <div class="campo">
                            <label for="gPassword">Contraseña</label>
                            <input type="password" id="gPassword" required>
                        </div>
                        <div class="campo">
                            <label for="gRol">Rol</label>
                            <select id="gRol" required>
                                <option value="Cliente">Cliente</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                    </div>

                    <div class="botones">
                        <button type="submit" class="boton" id="btnGuardarUsuario">Agregar usuario</button>
                        <button type="button" class="boton-secundario" id="btnCancelarUsuario">Limpiar</button>
                    </div>
                </form>

                <div class="tabla">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios"></tbody>
                    </table>
                </div>
            </div>

            <button onclick="cerrarSesion()" class="boton-rojo">Cerrar sesión</button>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
