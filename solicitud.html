<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitud de mantenimiento</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- MENU -->

    <nav>

        <h2>AutoCare</h2>

        <a href="index.html">Inicio</a>

        <a href="login.html">Iniciar sesión</a>

    </nav>


    <!-- FORMULARIO -->

    <main>

        <h1>Solicitud de mantenimiento</h1>

        <form id="formSolicitud">

            <input type="hidden" id="solicitudId">


            <!-- DATOS DEL CLIENTE -->

            <h2>Datos del cliente</h2>

            <div class="campo">

                <label for="nombreCliente">
                    Nombre completo
                </label>

                <input type="text"
                       id="nombreCliente"
                       required>

            </div>


            <div class="campo">

                <label for="telefono">
                    Teléfono
                </label>

                <input type="tel"
                       id="telefono"
                       pattern="09[0-9]{8}"
                       placeholder="0991234567"
                       required>

            </div>


            <div class="campo">

                <label for="email">
                    Correo electrónico
                </label>

                <input type="email"
                       id="email"
                       required>

            </div>


            <!-- DATOS DEL VEHICULO -->

            <h2>Datos del vehículo</h2>


            <div class="campo">

                <label for="placa">
                    Placa
                </label>

                <input type="text"
                       id="placa"
                       pattern="[A-Za-z]{3}[0-9]{3,4}"
                       title="Formato: ABC1234"
                       placeholder="ABC1234"
                       required>

            </div>


            <div class="campo">

                <label for="marca">
                    Marca
                </label>

                <input type="text"
                       id="marca"
                       required>

            </div>


            <div class="campo">

                <label for="modelo">
                    Modelo
                </label>

                <input type="text"
                       id="modelo"
                       required>

            </div>


            <div class="campo">

                <label for="anio">
                    Año
                </label>

                <input type="number"
                       id="anio"
                       min="1980"
                       max="2026"
                       required>

            </div>


            <div class="campo">

                <label for="kilometraje">
                    Kilometraje
                </label>

                <input type="number"
                       id="kilometraje"
                       min="0"
                       required>

            </div>


            <!-- SERVICIO -->

            <h2>Servicio solicitado</h2>


            <div class="campo">

                <label for="servicio">
                    Tipo de servicio
                </label>

                <select id="servicio" required>

                    <option value="">
                        Seleccione un servicio
                    </option>

                    <option value="Mantenimiento preventivo">
                        Mantenimiento preventivo
                    </option>

                    <option value="Diagnóstico automotriz">
                        Diagnóstico automotriz
                    </option>

                    <option value="Reparación">
                        Reparación
                    </option>

                    <option value="Cambio de aceite">
                        Cambio de aceite
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="fecha">
                    Fecha
                </label>

                <input type="date"
                       id="fecha"
                       required>

            </div>


            <div class="campo">

                <label for="hora">
                    Hora
                </label>

                <input type="time"
                       id="hora"
                       required>

            </div>


            <!-- MODALIDAD -->

            <h3>Modalidad</h3>

            <div class="opcion">

                <input type="radio"
                       name="atencion"
                       id="presencial"
                       value="Presencial"
                       required>

                <label for="presencial">
                    Presencial
                </label>

            </div>


            <div class="opcion">

                <input type="radio"
                       name="atencion"
                       id="domicilio"
                       value="A domicilio">

                <label for="domicilio">
                    A domicilio
                </label>

            </div>


            <!-- SERVICIOS ADICIONALES -->

            <h3>Servicios adicionales</h3>


            <div class="opcion">

                <input type="checkbox"
                       id="lavado"
                       class="extra"
                       value="Lavado">

                <label for="lavado">
                    Lavado
                </label>

            </div>


            <div class="opcion">

                <input type="checkbox"
                       id="alineacion"
                       class="extra"
                       value="Alineación">

                <label for="alineacion">
                    Alineación
                </label>

            </div>


            <div class="opcion">

                <input type="checkbox"
                       id="balanceo"
                       class="extra"
                       value="Balanceo">

                <label for="balanceo">
                    Balanceo
                </label>

            </div>


            <!-- OBSERVACIONES -->

            <div class="campo">

                <label for="observaciones">
                    Observaciones
                </label>

                <textarea id="observaciones"
                          rows="4"></textarea>

            </div>


            <!-- BOTONES -->

            <div class="botones">

                <button type="submit" class="boton">

                    Guardar solicitud

                </button>


                <button type="reset" class="boton-secundario">

                    Limpiar

                </button>


                <a href="index.html" class="boton-volver">

                    Volver

                </a>

            </div>

        </form>

    </main>


    <!-- SWEETALERT -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
